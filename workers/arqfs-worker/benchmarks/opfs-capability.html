<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>arqfs sqlite-wasm + OPFS capability check (ARQ-196/219)</title>
  </head>
  <body>
    <script type="module">
      // Each call creates a brand new Worker instance and terminates it before
      // resolving, so a write followed by a page reload followed by a read proves
      // real OPFS persistence across both worker teardown AND full page navigation -
      // not JS variable retention within a single long-lived worker.
      let nextId = 1;

      function runOnFreshWorker(request) {
        return new Promise((resolve, reject) => {
          const worker = new Worker('./opfs-capability-worker.js', { type: 'module' });
          const timeout = setTimeout(() => {
            worker.terminate();
            reject(new Error('worker timed out'));
          }, 10_000);
          worker.onmessage = (event) => {
            clearTimeout(timeout);
            worker.terminate();
            resolve(event.data);
          };
          worker.onerror = (event) => {
            clearTimeout(timeout);
            worker.terminate();
            reject(new Error(event.message || 'worker error'));
          };
          worker.postMessage({ id: nextId++, ...request });
        });
      }

      window.__arqfsWrite = (value) => runOnFreshWorker({ type: 'write', value });
      window.__arqfsRead = () => runOnFreshWorker({ type: 'read' });
      window.__ARQ_ARQFS_CAPABILITY_READY__ = true;
    </script>
  </body>
</html>
