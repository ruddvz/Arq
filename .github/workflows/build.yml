# Explicit production-build gate. #402 owns the startup/deferred bundle budget;
# this workflow builds the real web app, runs the guard against that output and
# retains the raw measurement rather than leaving it only in a log.
name: Build

on:
  pull_request:
  merge_group:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: test -f apps/marketing/dist/index.html && test -f apps/marketing/dist/404.html
      - run: test -f apps/web/dist/index.html
      # Guard the guard first, then consume the single canonical #402 budget.
      - run: pnpm check:web-bundle-budget:test
      - run: pnpm check:web-bundle-budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-bundle-performance
          path: benchmarks/results/web-bundle-current.json
          if-no-files-found: warn
      - run: test -f packages/mcp-server/dist/arq-mcp-stdio.mjs
      - run: pnpm benchmark:mcp-protocol
