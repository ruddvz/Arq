# The explicit build gate ci.yml never had: apps/web previously only built as
# a side effect of capability-check scripts, and apps/marketing's static-site
# build (which also regenerates the SBOM for its open-source notices page)
# was not exercised at all. Replaces the echo-only "Quality template".
name: Build

# merge_group alongside pull_request: ci.yml and engineering-gate.yml already
# declare it, so without it here a merge queue would run the tests and the
# evidence gate over the merged result while the build gate saw only the
# pre-merge branches - two branches that each build can still fail to build
# together.
on:
  pull_request:
  merge_group:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The marketing site's own acceptance tests run in the main test suite;
      # here we only prove the rendered output exists and is non-trivial.
      - run: test -f apps/marketing/dist/index.html && test -f apps/marketing/dist/404.html
      - run: test -f apps/web/dist/index.html
      # A start-up budget for apps/web, and a check that the code splits it
      # relies on still hold. The 3D split made once in 4c31107 had silently
      # come undone by the time anything measured again: the entry chunk was
      # back to 1,762kB raw / 743kB gzipped, larger than the figure that
      # prompted the original work. The self-test runs first, because a guard
      # that cannot fail would report a clean bundle either way.
      - run: pnpm check:web-bundle-budget:test
      - run: pnpm check:web-bundle-budget
      - run: test -f packages/mcp-server/dist/arq-mcp-stdio.mjs
      # The MCP package's own tests drive the protocol in-process, which
      # proves dispatch and nothing about whether the server can be launched
      # and talked to. This spawns the built bundle and speaks real
      # line-delimited JSON-RPC to it: the handshake, the no-grant default,
      # a staged proposal that changes nothing, a refusal that names the
      # missing domain profile, and withdrawal taking effect on the next
      # call after the grant file is deleted mid-session (ADR-0027).
      - run: pnpm benchmark:mcp-protocol
