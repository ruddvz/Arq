name: ZEUS autonomy format autofix

on:
  push:
    branches:
      - codex/zeus-autonomy-gate-integration-v4

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zeus-autonomy-gate-integration-v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pinned Prettier and commit
        run: |
          pnpm exec prettier --write scripts/zeus-drift-guard.mjs
          if git diff --quiet -- scripts/zeus-drift-guard.mjs; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/zeus-drift-guard.mjs
          git commit -m 'style(zeus): format autonomy drift integration'
          git push origin HEAD:codex/zeus-autonomy-gate-integration-v4
