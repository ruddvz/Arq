name: Engineering context artifact

on:
  push:
    branches:
      - codex/zeus-autonomy-gate-integration-v4

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate engineering context
        run: node engineering/tools/engineering/build-engineering-context.mjs --root engineering --repo-root .
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-context-v5
          path: engineering/ops/generated/engineering-context-v5.json
          if-no-files-found: error
