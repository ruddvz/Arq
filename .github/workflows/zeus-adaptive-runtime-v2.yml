name: ZEUS adaptive runtime v2

on:
  pull_request:
    paths:
      - 'scripts/zeus-adaptive-runtime.mjs'
      - 'scripts/zeus-adaptive-runtime.test.mjs'
      - 'scripts/zeus-adaptive-budget.mjs'
      - '.zeus/adaptive-cto.json'
      - '.github/workflows/zeus-adaptive-runtime-v2.yml'

permissions:
  contents: write

jobs:
  runtime-regression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pinned Prettier and run runtime regression
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write scripts/zeus-adaptive-runtime.mjs scripts/zeus-adaptive-runtime.test.mjs
          pnpm exec prettier --check scripts/zeus-adaptive-runtime.mjs scripts/zeus-adaptive-runtime.test.mjs
          node scripts/zeus-adaptive-runtime.test.mjs

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/zeus-adaptive-runtime.mjs scripts/zeus-adaptive-runtime.test.mjs
          if git diff --cached --quiet; then
            echo 'No formatter changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(zeus): apply pinned runtime formatting'
          git push origin HEAD:${{ github.head_ref }}
