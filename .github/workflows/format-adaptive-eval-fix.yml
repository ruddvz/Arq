name: Format adaptive eval fix

on:
  push:
    branches:
      - codex/zeus-adaptive-eval-v1
    paths:
      - 'scripts/zeus-adaptive-eval.mjs'
      - 'scripts/zeus-adaptive-eval.test.mjs'
      - '.github/workflows/format-adaptive-eval-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/zeus-adaptive-eval-v1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format adaptive evaluation
        run: pnpm exec prettier --write scripts/zeus-adaptive-eval.mjs scripts/zeus-adaptive-eval.test.mjs

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Adaptive evaluation is already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/zeus-adaptive-eval.mjs scripts/zeus-adaptive-eval.test.mjs
          git commit -m 'style(Zeus): format adaptive evaluation'
          git push origin HEAD:codex/zeus-adaptive-eval-v1
