name: Engineering context refresh probe

on:
  push:
    branches:
      - codex/engineering-context-refresh-v1

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate engineering context and print diff
        run: |
          node engineering/tools/engineering/build-engineering-context.mjs --root engineering --repo-root .
          git diff -- engineering/ops/generated/engineering-context-v5.json
