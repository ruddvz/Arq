name: ZEUS adaptive format probe

on:
  pull_request:
    paths:
      - 'scripts/zeus-adaptive-budget.mjs'
      - 'scripts/zeus-adaptive-budget.test.mjs'
      - '.github/workflows/zeus-adaptive-format-probe.yml'

permissions:
  contents: write

jobs:
  prettier-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove diagnostic and apply pinned Prettier
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'scripts/zeus-adaptive-budget.test.mjs'
          const source = fs.readFileSync(file, 'utf8')
          const marker = "\nif (process.env.CI === 'true') {"
          const index = source.indexOf(marker)
          if (index !== -1) fs.writeFileSync(file, `${source.slice(0, index).trimEnd()}\n`)
          NODE
          pnpm exec prettier --write scripts/zeus-adaptive-budget.mjs scripts/zeus-adaptive-budget.test.mjs
          pnpm exec prettier --check scripts/zeus-adaptive-budget.mjs scripts/zeus-adaptive-budget.test.mjs

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/zeus-adaptive-budget.mjs scripts/zeus-adaptive-budget.test.mjs
          if git diff --cached --quiet; then
            echo 'No formatter changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(zeus): apply pinned Prettier output'
          git push origin HEAD:${{ github.head_ref }}
