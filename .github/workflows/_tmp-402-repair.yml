name: Temporary #402 review repair

on:
  push:
    branches:
      - codex/arq-402-performance-authority-v1

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arq-402-performance-authority-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review repairs
        run: node scripts/_tmp-repair-402.mjs
      - name: Format only #402-owned files
        run: >-
          pnpm exec prettier --write
          .github/workflows/benchmark.yml
          .github/workflows/build.yml
          benchmarks/PERFORMANCE-BUDGETS.json
          benchmarks/fixtures/core-workflow-v1.json
          packages/editor-shell/src/selection-benchmark.test.ts
          packages/geometry-2d/src/room-rebuild-benchmark.test.ts
          scripts/check-performance-authority-test.mjs
          scripts/check-performance-authority.mjs
          scripts/check-web-bundle-budget.mjs
          scripts/lib/performance-authority.mjs
          scripts/run-canvas-2d-benchmark.mjs
          scripts/run-canvaskit-benchmark.mjs
          scripts/run-core-workflow-performance.mjs
          scripts/run-material-compositing-performance.mjs
          scripts/run-pixijs-webgl-benchmark.mjs
          scripts/run-render-frame-benchmark.mjs
      - name: Verify repaired authority
        run: |
          node scripts/check-performance-authority-test.mjs
          node scripts/check-performance-authority.mjs
          pnpm check:web-bundle-budget:test
          pnpm exec prettier --check \
            .github/workflows/benchmark.yml \
            .github/workflows/build.yml \
            benchmarks/PERFORMANCE-BUDGETS.json \
            benchmarks/fixtures/core-workflow-v1.json \
            packages/editor-shell/src/selection-benchmark.test.ts \
            packages/geometry-2d/src/room-rebuild-benchmark.test.ts \
            scripts/check-performance-authority-test.mjs \
            scripts/check-performance-authority.mjs \
            scripts/check-web-bundle-budget.mjs \
            scripts/lib/performance-authority.mjs \
            scripts/run-canvas-2d-benchmark.mjs \
            scripts/run-canvaskit-benchmark.mjs \
            scripts/run-core-workflow-performance.mjs \
            scripts/run-material-compositing-performance.mjs \
            scripts/run-pixijs-webgl-benchmark.mjs \
            scripts/run-render-frame-benchmark.mjs
      - name: Remove temporary workflow and commit repair
        run: |
          rm .github/workflows/_tmp-402-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(perf): harden #402 performance authority"
          git push origin HEAD:codex/arq-402-performance-authority-v1
