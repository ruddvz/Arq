name: CI

# push covers the actual default branch (this repository's default is the
# long-lived claude/arq-cad-platform-research-ba8rav branch, not main);
# merge_group is present so a merge queue can be enabled later without a
# coverage gap — see engineering/33_IMPLEMENTATION_HANDOFF.md Phase 2.
on:
  pull_request:
  merge_group:
  push:
    branches: [claude/arq-cad-platform-research-ba8rav]

# This is the expensive workflow - eleven headless-Chromium capability checks,
# the full test suite and the language ladder - and without a concurrency group
# two pushes a minute apart ran all of it twice, with the older run's result
# arriving after the newer one and overwriting nothing useful. Superseding an
# in-flight run is safe here because every job is a pure function of the commit.
# Not `github.ref` alone: on pull_request that is the merge ref, which would
# collide across different PRs targeting the same base.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Package 3.0/4.0 workspace registries: integrity fails the build,
      # designed-vs-built coverage is printed for the log only.
      - run: pnpm check:workspace-registries
      # Interaction Foundation 1.0: rule-driven editor dependency boundaries
      # (quality/editor-dependency-boundaries.json) - Lenis-style scroll
      # hijacking, duplicate accessibility foundations, and parallel
      # state/animation frameworks fail the build in editor-critical paths.
      - run: pnpm check:editor-dependency-boundaries

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/arqfs's native suite requires a real better-sqlite3 binding
      # for the active Node ABI - `pnpm install` builds/fetches it as part of
      # better-sqlite3's own install step. If that step is ever skipped or
      # fails silently, the native arqfs tests must fail loudly here rather
      # than the suite quietly passing with the native module absent - see
      # arqfs-node-driver.ts's own doc comment on why it exists.
      - run: pnpm test

  browser-capability-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      # Real headless-Chromium evidence for the claims this repository makes
      # about OPFS persistence, single-writer coordination, cross-project
      # isolation, and the overlay/file-open UI - the same checks used to
      # verify ARQFS-008/009/012-014 and UI-001/003/011 during development,
      # now enforced on every PR rather than only run by hand.
      - run: pnpm benchmark:arqfs-opfs
      - run: pnpm benchmark:arqfs-writer-lock
      - run: pnpm benchmark:arqfs-project-isolation
      - run: pnpm benchmark:design-system-dialog
      - run: pnpm benchmark:file-open
      # Engineering OS 5.0 proof-gap closures: browser_journal_recovery proves
      # a real edit journals to IndexedDB and is recovered after reload,
      # distinct from a portable project-file save; browser_model_canvas
      # proves the 3D tab is user-reachable, renders through WebGL2, and
      # shares selection with the plan canvas - the evidence that resolved
      # CONFLICT-3D-CURRENT-STATUS.
      - run: pnpm benchmark:journal-recovery
      - run: pnpm benchmark:model-canvas
      # Interaction Foundation 1.0: the wall Context HUD's full contract -
      # anchor lifecycle, numeric entry through the tool's own overlay,
      # shortcut/wheel ownership, escape tiers, undo/redo, reduced motion.
      - run: pnpm benchmark:wall-hud
      # Doc 52's workspace visual QA protocol, asserted rather than eyeballed:
      # band, canvas floor, no horizontal overflow, touch bands canvas-first
      # with a way to summon panels back, and save/sync separately legible, at
      # all eight workspace-qa-fixtures.json viewports.
      - run: pnpm benchmark:workspace-layout
      # The two input checks were the only capability checks this repository
      # owned that no workflow ran, so the Pencil pressure/tilt path and the
      # pointer hover sequence were verified once by hand and never again.
      - run: pnpm benchmark:pencil-input
      - run: pnpm benchmark:hover-sequence
      # The privacy claim, observed rather than asserted: every request the
      # real bundle attempts while a wall is drawn, the 3D view opened and the
      # file panel used must go to the origin that served it.
      - run: pnpm benchmark:network-observation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-capability-check-results
          path: benchmarks/results/

  # Arq Language System 4.1. The order is fixed by docs/product/voice: source
  # contract, installed footprint, public-copy inventory, route coverage,
  # context freshness, canonical data, editorial policy, state and adapter
  # coverage, conflict and claim gates, wiring, hard audit, rendered site.
  #
  # This job deliberately never regenerates the committed language context.
  # Refreshing it here would turn a stale-context failure into a silent pass;
  # the freshness check must fail so that a human refreshes it in the same
  # change that altered the canonical sources.
  language-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify language source contract
        run: pnpm arq:language:sources:verify
      - name: Verify language installation, public-copy inventory and route coverage
        run: |
          pnpm arq:language:install:verify
          pnpm arq:language:public:verify
          pnpm arq:language:routes:verify
      - name: Verify canonical context freshness
        run: pnpm arq:language:context:verify
      - name: Verify canonical data and state language
        run: |
          pnpm arq:language:data:verify
          pnpm arq:language:editorial:verify
          pnpm arq:language:state:verify
          pnpm arq:language:adapters:verify
      - name: Verify claim and conflict gates
        run: |
          pnpm arq:language:conflicts:verify
          pnpm arq:language:claims:verify
      - name: Verify Arq language-system wiring
        run: pnpm arq:language:verify
      - name: Enforce hard Arq language rules
        run: pnpm arq:language:audit:ci
      - name: Build and verify rendered public copy
        run: |
          pnpm --filter @arq/marketing build
          pnpm arq:language:site:build:verify --site-root apps/marketing/dist

  dependency-licence-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:dependency-licences
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom
          path: dependency-sbom.json

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets
      - run: cargo test --manifest-path rust/Cargo.toml
