name: ZEUS autonomy drift format probe

on:
  push:
    branches:
      - codex/zeus-autonomy-gate-integration-v4

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier --write scripts/zeus-drift-guard.mjs
          git diff -- scripts/zeus-drift-guard.mjs
