name: Format ZEUS autonomy fix

on:
  push:
    branches:
      - codex/zeus-autonomy-gate-integration-v4

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zeus-autonomy-gate-integration-v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatting to autonomy drift guard
        run: pnpm exec prettier --write scripts/zeus-drift-guard.mjs
      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/zeus-drift-guard.mjs; then
            echo "Drift guard already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/zeus-drift-guard.mjs
          git commit -m "style(zeus): format autonomy drift guard"
          git push origin HEAD:codex/zeus-autonomy-gate-integration-v4
