name: Public site v2 language context refresh

on:
  push:
    branches:
      - codex/arq-public-site-editorial-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/arq-public-site-editorial-v1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh governed ARQ language context
        run: pnpm arq:language:refresh

      - name: Verify refreshed language context
        run: pnpm arq:language:context:verify

      - name: Remove one-shot workflow and commit generated context
        run: |
          git rm .github/workflows/public-site-v2-language-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product/voice
          git diff --cached --check
          git commit -m 'chore(marketing): refresh governed language context'
          git push origin HEAD:codex/arq-public-site-editorial-v1
