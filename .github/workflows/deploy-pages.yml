# Deploys the public website (apps/marketing) to GitHub Pages.
#
# The site builds with SITE_BASE_PATH=/Arq because a project Pages site is
# served under https://<owner>.github.io/Arq/ - every internal URL is
# prefixed at build time (see apps/marketing/src/build.ts's applyBasePath).
# SITE_ORIGIN enables sitemap.xml, the robots Sitemap line and absolute
# Open Graph URLs.
#
# Triggers: pushes that touch the site on the default branch, plus manual
# dispatch. (The audit/completion branch trigger was trimmed after PR #282
# merged, as its own comment instructed.)
#
# Engineering OS 5.0: engineering/../templates/.github/workflows/
# deploy-pages.v5.fragment.yml adds rendered-artifact and post-deploy
# public-site proof steps here. Those steps call Arq Language System 4.1
# scripts (arq:language:*) that are not yet installed — merging them now
# would fail every deploy. The deploy job already exposes page_url below so
# the live-verify job can be added without restructuring. Tracked in
# engineering/34_LIMITS_AND_OWNER_DECISIONS.md.
name: Deploy website

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arq-cad-platform-research-ba8rav
    paths:
      - 'apps/marketing/**'
      - 'brand/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# One live site; a newer deploy supersedes an in-flight one.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arq/marketing build
        env:
          SITE_BASE_PATH: /Arq
          SITE_ORIGIN: https://ruddvz.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/marketing/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
