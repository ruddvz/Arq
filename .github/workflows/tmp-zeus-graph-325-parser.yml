name: tmp zeus graph 325 parser

on:
  push:
    branches:
      - codex/zeus-cross-language-graph-325-scratch

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format parser files
        run: |
          pnpm exec prettier --write scripts/lib/zeus-repository-symbols.mjs scripts/zeus-repository-symbols.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/zeus-repository-symbols.mjs scripts/zeus-repository-symbols.test.mjs
          git diff --cached --quiet || git commit -m "style(zeus): format cross-language graph parser"
          git push
      - run: pnpm exec prettier --check scripts/lib/zeus-repository-symbols.mjs scripts/zeus-repository-symbols.test.mjs
      - run: node --test scripts/zeus-repository-symbols.test.mjs
