name: ARQ 355 final correctness

on:
  push:
    branches:
      - codex/arq-native-editor-persistence-355-recovery
    paths:
      - .github/workflows/arq-355-final-correctness.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arq-native-editor-persistence-355-recovery
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard persistence status against stale async completions
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/App.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              """  const journalRef = useRef<PlanJournal | null>(null);
            const wallIdCounterRef = useRef(0);""",
              """  const journalRef = useRef<PlanJournal | null>(null);
            // Every persistence attempt gets a generation. Only the newest attempt may
            // settle the global save indicator, so an older queued write cannot say
            // “saved” while a newer edit is still waiting for acknowledgement.
            const persistenceRevisionRef = useRef(0);
            const wallIdCounterRef = useRef(0);""",
              'persistence revision ref',
          )

          replace_once(
              """    journalRef.current = journal;
              let cancelled = false;
              journal
                .recover(PLAN_PROJECT_ID)
                .then(({ walls, recoveredOperationCount }) => {
                  if (cancelled) {
                    return;
                  }""",
              """    journalRef.current = journal;
              let cancelled = false;
              const recoveryRevision = persistenceRevisionRef.current;
              journal
                .recover(PLAN_PROJECT_ID)
                .then(({ walls, recoveredOperationCount }) => {
                  if (cancelled || recoveryRevision !== persistenceRevisionRef.current) {
                    return;
                  }""",
              'recovery generation guard',
          )

          replace_once(
              """      .catch(() => {
                if (!cancelled) {
                  setSaveState('unsaved-changes');
                  setJournalLabel('Journal unavailable');
                }
              });
            const unsubscribe = journal.onUnavailable(() => {
              setSaveState('unsaved-changes');
              setJournalLabel('Journal unavailable');
            });""",
              """      .catch(() => {
                if (!cancelled && recoveryRevision === persistenceRevisionRef.current) {
                  setSaveState('unsaved-changes');
                  setJournalLabel('Journal unavailable');
                }
              });
            const unsubscribe = journal.onUnavailable(() => {
              // The demo journal is not the persistence authority while a native
              // project is open, so its health must not overwrite native save state.
              if (nativeSessionRef.current !== null) return;
              setSaveState('unsaved-changes');
              setJournalLabel('Journal unavailable');
            });""",
              'journal unavailable authority guard',
          )

          replace_once(
              """    (operation: WorkspaceOperation, walls: readonly DrawnWall[]) => {
                if (operation.kind === 'note') return;
                setSaveState('saving');
                void persistWorkspaceOperation({""",
              """    (operation: WorkspaceOperation, walls: readonly DrawnWall[]) => {
                if (operation.kind === 'note') return;
                const revision = ++persistenceRevisionRef.current;
                setSaveState('saving');
                void persistWorkspaceOperation({""",
              'persist begin generation',
          )

          replace_once(
              """      }).then((result) => {
                if (result.status === 'skipped') return;
                if (result.status === 'saved') {""",
              """      }).then((result) => {
                if (revision !== persistenceRevisionRef.current) return;
                if (result.status === 'skipped') return;
                if (result.status === 'saved') {""",
              'persist settle generation guard',
          )

          replace_once(
              """      const previous = nativeSessionRef.current;
                nativeSessionRef.current = opened.session;""",
              """      // Invalidate demo or previous-project completions before changing
                // persistence authority. Their promises may still settle later.
                persistenceRevisionRef.current += 1;
                const previous = nativeSessionRef.current;
                nativeSessionRef.current = opened.session;""",
              'native adoption generation invalidation',
          )

          replace_once(
              """      // Read from the working copy, not written to it yet: "opened" is not
                // "saved", and this build does not checkpoint edits back to the `.arq`
                // file. Saying `saved` here would claim durability the product has not
                // Opening establishes a committed working-copy baseline. Flat projects can
                // continue through the native save path; reference projects remain readable
                // but wall edits are blocked until their richer semantics can round-trip.
                setSaveState('saved');""",
              """      // Opening establishes a committed working-copy baseline only for
                // the flat model this editor can round-trip. Read-only and reference
                // projects are intentionally not presented as saved/editable surfaces.
                const canPersistWallEdits =
                  !opened.snapshot.readOnly && opened.snapshot.document === null;
                setSaveState(canPersistWallEdits ? 'saved' : 'unsaved-changes');""",
              'native open save state',
          )

          path.write_text(text)
          PY
      - name: Format scoped changes
        run: pnpm exec prettier --write apps/web/src/App.tsx
      - name: Run focused persistence tests
        run: pnpm exec vitest run apps/web/src/project/native-project-session.test.ts apps/web/src/project/workspace-persistence.test.ts --coverage=false
      - name: Typecheck web app
        run: pnpm --filter @arq/web typecheck
      - name: Run repository typecheck
        run: pnpm typecheck
      - name: Commit correctness fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx
          git commit -m "fix(arqfs): keep persistence status tied to latest edit"
          git push origin HEAD:codex/arq-native-editor-persistence-355-recovery
