          Path('packages/arqfs/src/arqfs-worker-migration.test.ts').write_text(r'''import { describe, expect, it, vi } from 'vitest';
import { createNodeArqfsDriver } from './arqfs-node-driver';
import { createArqfsSchemaV1 } from './arqfs-schema';
import {
  createArqfsWorkerSession,
  handleArqfsWorkerRequest,
  type ArqfsWorkerContext,
} from './arqfs-worker-handler';

const PROJECT_ID = 'migration-test-project';

describe('arqfs Worker schema migration RPC', () => {
  it('only migrates an opened older compatible schema and invalidates the old open verdict', async () => {
    const driver = createNodeArqfsDriver();
    createArqfsSchemaV1(driver);
    const migrateSchemaV1ToV2 = vi.fn(async () => ({ status: 'migrated' as const }));
    const context: ArqfsWorkerContext = {
      driver,
      usedVfs: 'test-node-driver',
      projectId: PROJECT_ID,
      session: createArqfsWorkerSession(),
      migrateSchemaV1ToV2,
    };

    try {
      const opened = await handleArqfsWorkerRequest(context, { id: 1, type: 'open' });
      expect(opened.ok).toBe(true);
      if (!opened.ok || opened.payload.kind !== 'open' || opened.payload.result.status !== 'opened') {
        throw new Error('expected an opened older schema');
      }
      expect(opened.payload.result.capabilities.canMigrate).toBe(true);

      const migrated = await handleArqfsWorkerRequest(context, {
        id: 2,
        type: 'migrateSchemaV1ToV2',
      });
      expect(migrated).toMatchObject({
        ok: true,
        payload: { kind: 'migrateSchemaV1ToV2', result: { status: 'migrated' } },
      });
      expect(migrateSchemaV1ToV2).toHaveBeenCalledOnce();

      const readBeforeReopen = await handleArqfsWorkerRequest(context, {
        id: 3,
        type: 'readAllArchiveEntries',
      });
      expect(readBeforeReopen).toMatchObject({
        ok: false,
        code: 'ARQFS_WORKER_NOT_OPENED',
      });
    } finally {
      driver.close();
    }
  });

  it('refuses migration when the open verdict does not grant canMigrate', async () => {
    const driver = createNodeArqfsDriver();
    const migrateSchemaV1ToV2 = vi.fn(async () => ({ status: 'migrated' as const }));
    const context: ArqfsWorkerContext = {
      driver,
      usedVfs: 'test-node-driver',
      projectId: PROJECT_ID,
      session: createArqfsWorkerSession(),
      migrateSchemaV1ToV2,
    };
    try {
      await handleArqfsWorkerRequest(context, { id: 1, type: 'open' });
      const response = await handleArqfsWorkerRequest(context, {
        id: 2,
        type: 'migrateSchemaV1ToV2',
      });
      expect(response).toMatchObject({
        ok: false,
        code: 'ARQFS_WORKER_FILE_NOT_MIGRATABLE',
      });
      expect(migrateSchemaV1ToV2).not.toHaveBeenCalled();
    } finally {
      driver.close();
    }
  });
});
''')

