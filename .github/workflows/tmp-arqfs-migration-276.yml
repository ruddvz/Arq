import { reduceFileFlow, type FileFlowState } from './file-state-machine';

function stagedState(): FileFlowState {
  let state: FileFlowState = { kind: 'idle' };
  state = reduceFileFlow(state, { type: 'acquire', name: 'older.arq' });
  state = reduceFileFlow(state, { type: 'acquired' });
  state = reduceFileFlow(state, { type: 'route-native', sidecarDependency: 'complete' });
  state = reduceFileFlow(state, { type: 'stage-start' });
  state = reduceFileFlow(state, { type: 'stage-complete', projectId: 'working-copy' });
  return state;
}

describe('file-flow migration lifecycle', () => {
  it('enters migrating before it may claim migration verification', () => {
    const migrating = reduceFileFlow(stagedState(), { type: 'migration-start' });
    expect(migrating).toMatchObject({
      kind: 'migrating',
      projectId: 'working-copy',
    });
    const verified = reduceFileFlow(migrating, { type: 'migration-verified' });
    expect(verified).toEqual({
      kind: 'migration-verified',
      name: 'older.arq',
      projectId: 'working-copy',
    });
  });

  it('can quarantine a failed migration candidate from the migrating state', () => {
    const migrating = reduceFileFlow(stagedState(), { type: 'migration-start' });
    const quarantined = reduceFileFlow(migrating, {
      type: 'quarantine',
      quarantinePath: 'candidate.migration-v2',
    });
    expect(quarantined).toMatchObject({
      kind: 'quarantined',
      quarantinePath: 'candidate.migration-v2',
    });
  });
});
''')

