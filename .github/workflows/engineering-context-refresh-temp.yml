name: Engineering context refresh (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/engineering-context-refresh-temp.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Regenerate Engineering OS context
        run: node engineering/tools/engineering/build-engineering-context.mjs --root engineering --repo-root .
      - name: Commit regenerated context to the pull request branch
        run: |
          if git diff --quiet -- engineering/ops/generated/engineering-context-v5.json; then
            echo 'Engineering context already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/ops/generated/engineering-context-v5.json
          git commit -m 'chore(engineering): refresh source-hashed context'
          git push origin HEAD:${{ github.head_ref }}
