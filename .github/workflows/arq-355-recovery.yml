name: ARQ 355 recovery validation

on:
  push:
    branches:
      - codex/arq-native-editor-persistence-355-recovery
    paths:
      - .github/workflows/arq-355-recovery.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arq-native-editor-persistence-355-recovery
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate native persistence into current main code
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          session_path = Path('apps/web/src/project/native-project-session.ts')
          session = session_path.read_text()

          readonly_error = """export class NativeProjectReadOnlyError extends Error {
            constructor() {
              super('This project is open for reading only, so it was not changed.');
              this.name = 'NativeProjectReadOnlyError';
            }
          }
          """
          unsupported_error = readonly_error + """

          /**
           * The flat wall encoder cannot preserve a reference-format project's
           * levels, wall types, rooms, openings, hosted elements or views.
           */
          export class NativeProjectUnsupportedEditError extends Error {
            constructor() {
              super(
                'This reference-format project cannot persist wall edits until ARQ can preserve its full semantic model.',
              );
              this.name = 'NativeProjectUnsupportedEditError';
            }
          }
          """
          session = replace_once(session, readonly_error, unsupported_error, 'unsupported edit error')

          queue_fields = """  #queue: Promise<void> = Promise.resolve();
            #lastWriteError: unknown = null;
            #closed = false;
          """
          queue_replacement = """  #queue: Promise<void> = Promise.resolve();
            /** Changes that became visible in the editor but whose Worker write failed. */
            #pendingChanges: readonly NativeProjectChange[] = [];
            #lastWriteError: unknown = null;
            #closed = false;
          """
          session = replace_once(session, queue_fields, queue_replacement, 'pending change field')

          readonly_gate = """    if (this.#snapshot.readOnly) {
              // Refused here as well as in the Worker. The Worker gate is the one that
              // cannot be bypassed; this one keeps a read-only project from queueing
              // work that was never going to land.
              return Promise.reject(new NativeProjectReadOnlyError());
            }

            const run = (): Promise<void> => this.#commit(change);
          """
          guarded_gate = """    if (this.#snapshot.readOnly) {
              // Refused here as well as in the Worker. The Worker gate is the one that
              // cannot be bypassed; this one keeps a read-only project from queueing
              // work that was never going to land.
              return Promise.reject(new NativeProjectReadOnlyError());
            }
            if (this.#snapshot.document !== null) {
              // The current wall operation carries centreline geometry only. Passing a
              // reference project through the flat encoder would silently discard its
              // richer canonical model, so this is a hard session-level boundary.
              return Promise.reject(new NativeProjectUnsupportedEditError());
            }

            const run = (): Promise<void> => this.#commit(change);
          """
          session = replace_once(session, readonly_gate, guarded_gate, 'reference project save gate')

          commit_pattern = re.compile(
              r"  async #commit\(change: NativeProjectChange\): Promise<void> \{.*?\n  \}\n\n  /\*\*\n   \* The canonical semantic hash",
              re.S,
          )
          commit_replacement = """  async #commit(change: NativeProjectChange): Promise<void> {
            // Reapply failed changes in order, then the newest state. A later full wall
            // state therefore remains authoritative (including undo), while operation
            // history from a transient failure is not silently dropped.
            const pending = [...this.#pendingChanges, change];
            let next = this.#snapshot;
            let nextOperations = this.#operations;

            for (const candidate of pending) {
              next = {
                ...next,
                displayName: candidate.displayName ?? next.displayName,
                walls: candidate.walls ?? next.walls,
                journalSequence:
                  candidate.journalSequence ??
                  (candidate.operation === undefined
                    ? next.journalSequence
                    : next.journalSequence + 1),
              };
              if (candidate.operation !== undefined) {
                nextOperations = [...nextOperations, candidate.operation];
              }
            }

            const entries = await exportArchive({
              manifest: this.#manifest,
              model: encodeNativeProjectModel({ projectName: next.displayName, walls: next.walls }),
              operations: nextOperations,
            });

            try {
              await this.#handle.client.request({
                type: 'putArchiveEntries',
                entries: [...entries],
              });
            } catch (error) {
              // Canonical state remains the last Worker-acknowledged snapshot. Keep the
              // intended changes only for the next save attempt.
              this.#pendingChanges = pending;
              this.#lastWriteError = error;
              throw error;
            }

            this.#snapshot = next;
            this.#operations = nextOperations;
            this.#pendingChanges = [];
            this.#lastWriteError = null;
          }

          /**
           * The canonical semantic hash"""
          session, count = commit_pattern.subn(commit_replacement, session, count=1)
          if count != 1:
              raise SystemExit(f'commit method: expected one match, found {count}')
          session_path.write_text(session)

          test_path = Path('apps/web/src/project/native-project-session.test.ts')
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              """  NativeProjectSession,
            NativeProjectReadOnlyError,
            type NativeProjectSnapshot,
          """,
              """  NativeProjectSession,
            NativeProjectReadOnlyError,
            NativeProjectUnsupportedEditError,
            type NativeProjectSnapshot,
          """,
              'unsupported error test import',
          )
          shutdown_marker = """});

          describe('NativeProjectSession shutdown', () => {
          """
          added_tests = """  it('refuses the flat save path for a reference-format project before touching the Worker', async () => {
            const { session, requestTypes } = sessionWith(async () => ({ kind: 'putArchiveEntries' }), {
              document: {} as NativeProjectSnapshot['document'],
            });

            await expect(
              session.save({
                walls: [wall('w1', 1000)],
                operation: { kind: 'add-walls', walls: [wall('w1', 1000)] },
              }),
            ).rejects.toBeInstanceOf(NativeProjectUnsupportedEditError);
            expect(requestTypes).toEqual([]);
          });

          it('replays failed operation history into the next successful full-state save', async () => {
            const written: ReadonlyArray<readonly [string, Uint8Array]>[] = [];
            let attempt = 0;
            const { session } = sessionWith(async (request) => {
              if (request.type !== 'putArchiveEntries') throw new Error(`unexpected ${request.type}`);
              attempt += 1;
              if (attempt == 1) throw new Error('simulated durable write failure');
              written.push(request.entries ?? []);
              return { kind: 'putArchiveEntries' };
            });
            const first = wall('first', 1000);
            const second = wall('second', 2000);
            const firstOperation = { kind: 'add-walls', walls: [first] } as const;
            const secondOperation = { kind: 'add-walls', walls: [second] } as const;

            await expect(
              session.save({ walls: [first], operation: firstOperation }),
            ).rejects.toThrow('simulated durable write failure');
            await expect(
              session.save({ walls: [first, second], operation: secondOperation }),
            ).resolves.toBeUndefined();

            expect(session.snapshot()).toMatchObject({
              walls: [first, second],
              journalSequence: 2,
            });
            expect(session.hasUnsavedFailure).toBe(false);

            const archive = await importArchive(new Map(written[0]));
            expect(archive.status).toBe('opened');
            if (archive.status === 'opened') {
              expect(archive.model).toMatchObject({
                walls: [{ id: 'first' }, { id: 'second' }],
              });
              expect(archive.operations).toEqual([firstOperation, secondOperation]);
            }
          });

          it('lets a later full wall state supersede geometry from a failed change', async () => {
            const written: ReadonlyArray<readonly [string, Uint8Array]>[] = [];
            let attempt = 0;
            const { session } = sessionWith(async (request) => {
              if (request.type !== 'putArchiveEntries') throw new Error(`unexpected ${request.type}`);
              attempt += 1;
              if (attempt == 1) throw new Error('simulated durable write failure');
              written.push(request.entries ?? []);
              return { kind: 'putArchiveEntries' };
            });
            const failedWall = wall('failed', 1000);
            const replacement = wall('replacement', 2500);

            await expect(
              session.save({
                walls: [failedWall],
                operation: { kind: 'add-walls', walls: [failedWall] },
              }),
            ).rejects.toThrow('simulated durable write failure');
            await session.save({
              walls: [replacement],
              operation: { kind: 'remove-walls', wallIds: ['failed'] },
            });

            const archive = await importArchive(new Map(written[0]));
            expect(archive.status).toBe('opened');
            if (archive.status === 'opened') {
              expect(archive.model).toMatchObject({ walls: [{ id: 'replacement' }] });
            }
          });
          """
          tests = replace_once(tests, shutdown_marker, added_tests + '\n' + shutdown_marker, 'session recovery tests')
          test_path.write_text(tests)

          app_path = Path('apps/web/src/App.tsx')
          app = app_path.read_text()
          native_import = """import type { NativeProjectSession, NativeProjectSnapshot } from './project/native-project-session';
          """
          app = replace_once(
              app,
              native_import,
              native_import + "import { persistWorkspaceOperation } from './project/workspace-persistence';\n",
              'workspace persistence import',
          )

          journal_pattern = re.compile(
              r"  const journalOperation = useCallback\(\(operation: WorkspaceOperation\) => \{.*?\n  \}, \[\]\);\n\n  const \[projectName",
              re.S,
          )
          persistence_block = """  const persistOperation = useCallback(
            (operation: WorkspaceOperation, walls: readonly DrawnWall[]) => {
              if (operation.kind === 'note') return;
              setSaveState('saving');
              void persistWorkspaceOperation({
                nativeSession: nativeSessionRef.current,
                journal: journalRef.current,
                journalProjectId: PLAN_PROJECT_ID,
                operation,
                walls,
              }).then((result) => {
                if (result.status === 'skipped') return;
                if (result.status === 'saved') {
                  setSaveState('saved');
                  setJournalLabel(result.authority === 'native' ? 'Working copy current' : 'Journal current');
                  return;
                }

                setSaveState('unsaved-changes');
                if (result.status === 'blocked') {
                  setJournalLabel(
                    result.reason === 'read-only'
                      ? 'Project is read-only · changes are not saved'
                      : 'Reference project wall edits are not saved in this build',
                  );
                  return;
                }
                if (result.authority === 'native') {
                  setJournalLabel('Working copy write failed');
                  return;
                }
                setJournalLabel(
                  result.cause === 'storage-full'
                    ? 'Journal write failed: device storage is full'
                    : 'Journal write failed',
                );
              });
            },
            [],
          );

          const [projectName"""
          app, count = journal_pattern.subn(persistence_block, app, count=1)
          if count != 1:
              raise SystemExit(f'persistence callback: expected one match, found {count}')

          operation_pattern = re.compile(
              r"  /\*\* Applies a typed operation to the plan document, records its real inverse, journals it\. \*/\n  const performOperation = useCallback\(.*?\n  \}, \[journalOperation\]\);\n\n  const handleUndo = useCallback\(.*?\n  \}, \[journalOperation\]\);\n\n  const handleRedo = useCallback\(.*?\n  \}, \[journalOperation\]\);\n\n  const recordDemoAction",
              re.S,
          )
          operation_replacement = """  /** Applies a typed operation to the plan document, records its real inverse, and persists it. */
          const performOperation = useCallback(
            (operation: WorkspaceOperation) => {
              const current = drawnWallsRef.current;
              undoStackRef.current.push({
                forward: operation,
                inverse: invertOperation(current, operation),
              });
              const next = applyOperation(current, operation);
              setDrawnWalls(next);
              setHistoryVersion((v) => v + 1);
              persistOperation(operation, next);
              // The semantic edit is visible immediately. Persistence reports through
              // saveState and never rewrites that visible state on a failed write.
              const message = feedbackForOperation(operation);
              if (message !== null) {
                feedbackStoreRef.current.publish('success', message, Date.now());
              }
            },
            [persistOperation],
          );

          const handleUndo = useCallback(() => {
            const inverse = undoStackRef.current.undo();
            if (inverse !== null) {
              const next = applyOperation(drawnWallsRef.current, inverse);
              setDrawnWalls(next);
              persistOperation(inverse, next);
              feedbackStoreRef.current.publish('info', 'Undone', Date.now());
            }
            setHistoryVersion((v) => v + 1);
          }, [persistOperation]);

          const handleRedo = useCallback(() => {
            const forward = undoStackRef.current.redo();
            if (forward !== null) {
              const next = applyOperation(drawnWallsRef.current, forward);
              setDrawnWalls(next);
              persistOperation(forward, next);
              feedbackStoreRef.current.publish('info', 'Redone', Date.now());
            }
            setHistoryVersion((v) => v + 1);
          }, [persistOperation]);

          const recordDemoAction"""
          app, count = operation_pattern.subn(operation_replacement, app, count=1)
          if count != 1:
              raise SystemExit(f'operation handlers: expected one match, found {count}')

          open_state = """      // earned.
            setSaveState('unsaved-changes');
            setJournalLabel(
              opened.snapshot.readOnly
                ? 'Open for reading only · edits are not saved to this project'
                : 'Open from a local working copy · edits are not saved to this project yet',
            );
            setNativeProjectAvailability({ open: true, writable: !opened.snapshot.readOnly });
          """
          open_replacement = """      // Opening establishes a committed working-copy baseline. Flat projects can
            // continue through the native save path; reference projects remain readable
            // but wall edits are blocked until their richer semantics can round-trip.
            setSaveState('saved');
            setJournalLabel(
              opened.snapshot.readOnly
                ? 'Open for reading only · changes cannot be saved'
                : opened.snapshot.document !== null
                  ? 'Reference project open · wall edits are not persistable in this build'
                  : 'Working copy current',
            );
            setNativeProjectAvailability({ open: true, writable: !opened.snapshot.readOnly });
          """
          app = replace_once(app, open_state, open_replacement, 'native open save state')

          old_reason = """                writeReason: opened.snapshot.readOnly
                  ? 'This project was written by a newer version of ARQ, so it can be read but not changed.'
                  : 'Changes are kept in a local working copy on this device. Nothing is written back to the .arq file you chose.',
          """
          new_reason = """                writeReason: opened.snapshot.readOnly
                  ? 'This project was written by a newer version of ARQ, so it can be read but not changed.'
                  : opened.snapshot.document !== null
                    ? 'This project is open from a local working copy. Wall edits are not persisted until ARQ can preserve the full reference model.'
                    : 'Changes are kept in a local working copy on this device. Nothing is written back to the .arq file you chose.',
          """
          app = replace_once(app, old_reason, new_reason, 'native write reason')
          app_path.write_text(app)
          PY
      - name: Format scoped changes
        run: pnpm exec prettier --write apps/web/src/App.tsx apps/web/src/project/native-project-session.ts apps/web/src/project/native-project-session.test.ts apps/web/src/project/workspace-persistence.ts apps/web/src/project/workspace-persistence.test.ts
      - name: Run focused persistence tests
        run: pnpm exec vitest run apps/web/src/project/native-project-session.test.ts apps/web/src/project/workspace-persistence.test.ts --coverage=false
      - name: Typecheck web app
        run: pnpm --filter @arq/web typecheck
      - name: Run repository typecheck
        run: pnpm typecheck
      - name: Commit recovered implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/project/native-project-session.ts apps/web/src/project/native-project-session.test.ts apps/web/src/project/workspace-persistence.ts apps/web/src/project/workspace-persistence.test.ts
          git commit -m "feat(arqfs): persist workspace edits through native sessions"
          git push origin HEAD:codex/arq-native-editor-persistence-355-recovery
