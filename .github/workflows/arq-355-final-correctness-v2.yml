name: ARQ 355 final correctness v2

on:
  push:
    branches:
      - codex/arq-native-editor-persistence-355-recovery
    paths:
      - .github/workflows/arq-355-final-correctness-v2.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arq-native-editor-persistence-355-recovery
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard persistence status against stale async completions
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/App.tsx')
          text = path.read_text()

          def one(old: str, new: str, label: str) -> None:
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, found {n}')
              text = text.replace(old, new, 1)

          one(
              "  const journalRef = useRef<PlanJournal | null>(null);\n",
              "  const journalRef = useRef<PlanJournal | null>(null);\n"
              "  // Only the newest persistence attempt may settle the global save indicator.\n"
              "  const persistenceRevisionRef = useRef(0);\n",
              'revision ref',
          )
          one(
              "    let cancelled = false;\n    journal\n      .recover(PLAN_PROJECT_ID)\n      .then(({ walls, recoveredOperationCount }) => {\n        if (cancelled) {\n",
              "    let cancelled = false;\n"
              "    const recoveryRevision = persistenceRevisionRef.current;\n"
              "    journal\n      .recover(PLAN_PROJECT_ID)\n      .then(({ walls, recoveredOperationCount }) => {\n"
              "        if (cancelled || recoveryRevision !== persistenceRevisionRef.current) {\n",
              'recovery guard',
          )
          one(
              "      .catch(() => {\n        if (!cancelled) {\n          setSaveState('unsaved-changes');\n          setJournalLabel('Journal unavailable');\n        }\n      });\n",
              "      .catch(() => {\n"
              "        if (!cancelled && recoveryRevision === persistenceRevisionRef.current) {\n"
              "          setSaveState('unsaved-changes');\n"
              "          setJournalLabel('Journal unavailable');\n"
              "        }\n      });\n",
              'recovery failure guard',
          )
          one(
              "    const unsubscribe = journal.onUnavailable(() => {\n      setSaveState('unsaved-changes');\n      setJournalLabel('Journal unavailable');\n    });\n",
              "    const unsubscribe = journal.onUnavailable(() => {\n"
              "      // The demo journal is not authoritative while a native project is open.\n"
              "      if (nativeSessionRef.current !== null) return;\n"
              "      setSaveState('unsaved-changes');\n"
              "      setJournalLabel('Journal unavailable');\n"
              "    });\n",
              'journal authority guard',
          )
          one(
              "    (operation: WorkspaceOperation, walls: readonly DrawnWall[]) => {\n      if (operation.kind === 'note') return;\n      setSaveState('saving');\n",
              "    (operation: WorkspaceOperation, walls: readonly DrawnWall[]) => {\n"
              "      if (operation.kind === 'note') return;\n"
              "      const revision = ++persistenceRevisionRef.current;\n"
              "      setSaveState('saving');\n",
              'persist generation',
          )
          one(
              "      }).then((result) => {\n        if (result.status === 'skipped') return;\n",
              "      }).then((result) => {\n"
              "        if (revision !== persistenceRevisionRef.current) return;\n"
              "        if (result.status === 'skipped') return;\n",
              'settle guard',
          )
          one(
              "      const previous = nativeSessionRef.current;\n      nativeSessionRef.current = opened.session;\n",
              "      // Changing persistence authority invalidates completions from the old one.\n"
              "      persistenceRevisionRef.current += 1;\n"
              "      const previous = nativeSessionRef.current;\n"
              "      nativeSessionRef.current = opened.session;\n",
              'adoption invalidation',
          )
          one(
              "      // Read from the working copy, not written to it yet: \"opened\" is not\n"
              "      // \"saved\", and this build does not checkpoint edits back to the `.arq`\n"
              "      // file. Saying `saved` here would claim durability the product has not\n"
              "      // Opening establishes a committed working-copy baseline. Flat projects can\n"
              "      // continue through the native save path; reference projects remain readable\n"
              "      // but wall edits are blocked until their richer semantics can round-trip.\n"
              "      setSaveState('saved');\n",
              "      // A committed baseline is a saved/editable state only for the flat model\n"
              "      // this editor can round-trip without semantic loss.\n"
              "      const canPersistWallEdits =\n"
              "        !opened.snapshot.readOnly && opened.snapshot.document === null;\n"
              "      setSaveState(canPersistWallEdits ? 'saved' : 'unsaved-changes');\n",
              'open state',
          )

          path.write_text(text)
          PY
      - name: Format scoped changes
        run: pnpm exec prettier --write apps/web/src/App.tsx
      - name: Run focused persistence tests
        run: pnpm exec vitest run apps/web/src/project/native-project-session.test.ts apps/web/src/project/workspace-persistence.test.ts --coverage=false
      - name: Typecheck web app
        run: pnpm --filter @arq/web typecheck
      - name: Run repository typecheck
        run: pnpm typecheck
      - name: Commit correctness fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx
          git commit -m "fix(arqfs): keep save status tied to latest edit"
          git push origin HEAD:codex/arq-native-editor-persistence-355-recovery
