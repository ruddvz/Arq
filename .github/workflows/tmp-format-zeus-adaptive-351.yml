name: tmp format zeus adaptive 351

on:
  push:
    branches:
      - codex/zeus-adaptive-context-quality-v2

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/zeus-adaptive-quality-eval.mjs
      - run: git diff -- scripts/zeus-adaptive-quality-eval.mjs
