name: Apply ARQFS migration patch

on:
  push:
    branches:
      - codex/arqfs-cow-migration-v1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arqfs-cow-migration-v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply focused patch
        run: node scripts/apply-arqfs-cow-migration-patch-temp.cjs
      - name: Add explicit migration session type import
        run: |
          sed -i "s/import { conditionForcesReadOnly, resolveArqfsSafeModePlan } from '.\/arqfs-safe-mode';/import { conditionForcesReadOnly, resolveArqfsSafeModePlan, type ArqfsSafeModePlan } from '.\/arqfs-safe-mode';/" packages/arqfs/src/arqfs-worker-handler.ts
      - name: Format changed sources
        run: |
          pnpm exec prettier --write \
            packages/arqfs/src/arqfs-worker-protocol.ts \
            packages/arqfs/src/arqfs-worker-handler.ts \
            packages/arqfs/src/arqfs-worker-protocol.test.ts \
            packages/arqfs/src/arqfs-worker-handler.test.ts \
            apps/web/src/project/open-native-project.ts \
            apps/web/src/project/native-open-policy.ts \
            apps/web/src/project/open-native-project.test.ts \
            apps/web/src/file-handling/file-state-machine.ts \
            apps/web/src/file-handling/file-state-machine.test.ts \
            apps/web/src/file-handling/describe-file-flow-state.ts \
            apps/web/src/file-handling/describe-file-flow-state.test.ts \
            apps/web/src/file-handling/FileOpenPanel.tsx
      - name: Run focused migration tests
        run: |
          pnpm exec vitest run \
            packages/arqfs/src/arqfs-worker-protocol.test.ts \
            packages/arqfs/src/arqfs-worker-handler.test.ts \
            apps/web/src/project/open-native-project.test.ts \
            apps/web/src/file-handling/file-state-machine.test.ts \
            apps/web/src/file-handling/describe-file-flow-state.test.ts \
            --coverage=false
      - name: Typecheck repository
        run: pnpm typecheck
      - name: Commit verified implementation and remove temporary patch machinery
        run: |
          rm .github/workflows/arqfs-cow-migration-patch-temp.yml
          rm scripts/apply-arqfs-cow-migration-patch-temp.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(arqfs): migrate older projects on isolated working copies'
          git push origin HEAD:codex/arqfs-cow-migration-v1
