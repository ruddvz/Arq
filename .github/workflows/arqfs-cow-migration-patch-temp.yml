name: Apply ARQFS copy-on-write migration patch (temporary)

on:
  push:
    branches:
      - codex/arqfs-cow-migration-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arqfs-cow-migration-v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply focused migration integration patch
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, text) { fs.writeFileSync(path, text); }
          function replaceOne(path, before, after) {
            const text = read(path);
            const index = text.indexOf(before);
            if (index < 0) throw new Error(`Missing patch anchor in ${path}: ${before.slice(0, 120)}`);
            if (text.indexOf(before, index + before.length) >= 0) {
              throw new Error(`Patch anchor is not unique in ${path}: ${before.slice(0, 120)}`);
            }
            write(path, text.slice(0, index) + after + text.slice(index + before.length));
          }
          function replaceAll(path, before, after) {
            const text = read(path);
            if (!text.includes(before)) throw new Error(`Missing global patch anchor in ${path}: ${before}`);
            write(path, text.split(before).join(after));
          }
          function replaceRegex(path, regex, after) {
            const text = read(path);
            const matches = [...text.matchAll(regex)];
            if (matches.length !== 1) throw new Error(`Expected one regex match in ${path}, got ${matches.length}`);
            write(path, text.replace(regex, after));
          }

          const protocol = 'packages/arqfs/src/arqfs-worker-protocol.ts';
          replaceOne(
            protocol,
            "  | { readonly id: number; readonly type: 'open' }\n",
            "  | { readonly id: number; readonly type: 'open' }\n  /** Upgrade an already-open schema-v1 working copy to schema v2. The caller must only send this for a disposable copy, never the selected source file itself. */\n  | { readonly id: number; readonly type: 'migrateSchemaV1ToV2' }\n",
          );
          replaceOne(
            protocol,
            "  | { readonly kind: 'checkIntegrity'; readonly report: ArqfsIntegrityReport }\n",
            "  | {\n      readonly kind: 'migrateSchemaV1ToV2';\n      readonly fromSchema: 1;\n      readonly toSchema: 2;\n      readonly result: ArqfsOpenResult;\n      readonly safeMode: ArqfsSafeModePlan;\n      readonly usedVfs: string;\n    }\n  | { readonly kind: 'checkIntegrity'; readonly report: ArqfsIntegrityReport }\n",
          );
          replaceOne(
            protocol,
            "  /** The request was not a shape this protocol defines, so nothing was attempted. */\n  malformedRequest: 'ARQFS_WORKER_MALFORMED_REQUEST',\n",
            "  /** The current open verdict does not license a schema migration. */\n  migrationNotAllowed: 'ARQFS_WORKER_MIGRATION_NOT_ALLOWED',\n  /** A migration ran on the working copy but did not verify as a current healthy project. */\n  migrationFailed: 'ARQFS_WORKER_MIGRATION_FAILED',\n  /** The request was not a shape this protocol defines, so nothing was attempted. */\n  malformedRequest: 'ARQFS_WORKER_MALFORMED_REQUEST',\n",
          );
          replaceOne(
            protocol,
            "    case 'open':\n      return { id, type: 'open' };\n",
            "    case 'open':\n      return { id, type: 'open' };\n    case 'migrateSchemaV1ToV2':\n      return { id, type: 'migrateSchemaV1ToV2' };\n",
          );

          const handler = 'packages/arqfs/src/arqfs-worker-handler.ts';
          replaceOne(
            handler,
            "import { createArqfsSchemaLatest } from './arqfs-schema-v2';\n",
            "import { createArqfsSchemaLatest, migrateArqfsSchemaV1ToV2 } from './arqfs-schema-v2';\n",
          );
          replaceOne(
            handler,
            "export interface ArqfsWorkerSession {\n  openResult: ArqfsOpenResult | null;\n}\n\nexport function createArqfsWorkerSession(): ArqfsWorkerSession {\n  return { openResult: null };\n}\n",
            "export interface ArqfsWorkerSession {\n  openResult: ArqfsOpenResult | null;\n  /** The file-condition half of the last open verdict. Migration must not run across an interrupted/corrupt working copy even when the format version itself is writable. */\n  safeMode: ArqfsSafeModePlan | null;\n}\n\nexport function createArqfsWorkerSession(): ArqfsWorkerSession {\n  return { openResult: null, safeMode: null };\n}\n",
          );
          replaceOne(
            handler,
            "        context.session.openResult = null;\n        // Awaited: the import must have actually landed in storage before this\n",
            "        context.session.openResult = null;\n        context.session.safeMode = null;\n        // Awaited: the import must have actually landed in storage before this\n",
          );
          replaceOne(
            handler,
            "        context.session.openResult = result;\n\n        // The connection-level hardening arqfs-defensive-open.ts was written for.\n",
            "        context.session.openResult = result;\n        context.session.safeMode = safeMode;\n\n        // The connection-level hardening arqfs-defensive-open.ts was written for.\n",
          );
          replaceOne(
            handler,
            "      case 'putArchiveEntries': {\n",
            `      case 'migrateSchemaV1ToV2': {
        const current = context.session.openResult;
        const safeMode = context.session.safeMode;
        if (
          current === null ||
          current.status !== 'opened' ||
          !current.capabilities.canRead ||
          !current.capabilities.canWrite ||
          !current.capabilities.canMigrate ||
          current.capabilities.safeModeRequired ||
          safeMode === null ||
          conditionForcesReadOnly(safeMode)
        ) {
          return refuse(
            context,
            request.id,
            ARQFS_WORKER_ERROR_CODES.migrationNotAllowed,
            'This working copy is not eligible for schema migration. Nothing was migrated.',
          );
        }
        if (current.header.schema !== 1) {
          return refuse(
            context,
            request.id,
            ARQFS_WORKER_ERROR_CODES.migrationNotAllowed,
            \`Schema v1 to v2 migration requires schema 1, found \${current.header.schema}. Nothing was migrated.\`,
          );
        }

        const migration = migrateArqfsSchemaV1ToV2(context.driver);
        if (migration.status !== 'migrated') {
          return refuse(
            context,
            request.id,
            ARQFS_WORKER_ERROR_CODES.migrationFailed,
            migration.status === 'already-current'
              ? 'The working copy changed before migration could start.'
              : \`The working-copy migration failed: \${migration.reason}\`,
          );
        }

        const report = buildArqfsRecoveryReport(context.driver);
        const result = report.openResult;
        const nextSafeMode = resolveArqfsSafeModePlan(report);
        context.session.openResult = result;
        context.session.safeMode = nextSafeMode;
        const writable =
          result.status === 'opened' &&
          result.capabilities.canWrite &&
          !conditionForcesReadOnly(nextSafeMode);
        applyDefensiveOpenPolicy(context.driver, { readOnly: !writable });

        const integrity = checkArqfsIntegrity(context.driver);
        if (
          result.status !== 'opened' ||
          result.header.schema !== ARQFS_SCHEMA_VERSION_V2 ||
          !result.capabilities.canRead ||
          !result.capabilities.canWrite ||
          result.capabilities.canMigrate ||
          result.capabilities.safeModeRequired ||
          conditionForcesReadOnly(nextSafeMode) ||
          !integrity.ok
        ) {
          return refuse(
            context,
            request.id,
            ARQFS_WORKER_ERROR_CODES.migrationFailed,
            'The migrated working copy did not reopen as a current healthy project.',
          );
        }

        return {
          id: request.id,
          projectId: context.projectId,
          ok: true,
          payload: {
            kind: 'migrateSchemaV1ToV2',
            fromSchema: 1,
            toSchema: 2,
            result,
            safeMode: nextSafeMode,
            usedVfs: context.usedVfs,
          },
        };
      }
      case 'putArchiveEntries': {
`,
          );
          replaceOne(
            handler,
            "import { createArqfsSchemaLatest, migrateArqfsSchemaV1ToV2 } from './arqfs-schema-v2';\n",
            "import {\n  ARQFS_SCHEMA_VERSION_V2,\n  createArqfsSchemaLatest,\n  migrateArqfsSchemaV1ToV2,\n} from './arqfs-schema-v2';\n",
          );

          const openNative = 'apps/web/src/project/open-native-project.ts';
          replaceOne(
            openNative,
            "  readonly onStaged: (projectId: string) => void;\n  readonly onWorkerOpened: (\n",
            "  readonly onStaged: (projectId: string) => void;\n  /** Called only when this candidate actually needs an older-schema upgrade. */\n  readonly onMigrationStart?: () => void;\n  /** Reports whether an upgrade ran; false means the already-current working copy only needed verification. */\n  readonly onMigrationVerified?: (migrated: boolean) => void;\n  readonly onWorkerOpened: (\n",
          );
          replaceOne(
            openNative,
            "    const openResult: ArqfsOpenResult = openPayload.result;\n",
            "    let openResult: ArqfsOpenResult = openPayload.result;\n    let openSafeMode = openPayload.safeMode;\n",
          );
          replaceOne(
            openNative,
            "    const conditionWarning = describeOpenCondition(openPayload.safeMode);\n",
            "    let conditionWarning = describeOpenCondition(openSafeMode);\n",
          );
          replaceOne(
            openNative,
            `    const capabilities = resolveNativeOpenCapabilities(openResult);
    const readOnly = capabilities.readOnly || writerLocked || conditionWarning !== null;
    const warnings = [
      ...capabilities.warnings,
      ...(conditionWarning === null ? [] : [conditionWarning]),
      ...(writerLocked ? [describeReadOnlyReason(lease.reason)] : []),
    ];
    if (!openResult.capabilities.canRead) {
      return rejected('ARQ_OPEN_NOT_READABLE', capabilities.warnings[0] ?? 'Not readable.');
    }

`,
            `    if (!openResult.capabilities.canRead) {
      const capabilities = resolveNativeOpenCapabilities(openResult);
      return rejected('ARQ_OPEN_NOT_READABLE', capabilities.warnings[0] ?? 'Not readable.');
    }

`,
          );
          replaceOne(
            openNative,
            `    progress?.onStaged(workingCopyId);
    // Reports the whole truth about writability, which now has two independent
    // causes: the file's own writer-version floor, and whether this context won
    // the writer lock. Reporting only the first would announce a writable
    // project and then hand back a read-only one.
    progress?.onWorkerOpened(!readOnly, writerLocked ? 'another-window-is-editing' : null);
`,
            `    progress?.onStaged(workingCopyId);

    let migrated = false;
    if (openResult.capabilities.canMigrate && !writerLocked) {
      progress?.onMigrationStart?.();
      let migrationPayload;
      try {
        migrationPayload = await handle.client.request({ type: 'migrateSchemaV1ToV2' });
      } catch (error) {
        return rejected(
          'ARQ_MIGRATION_FAILED',
          error instanceof Error ? error.message : 'The working-copy migration failed.',
        );
      }
      if (migrationPayload.kind !== 'migrateSchemaV1ToV2') {
        return rejected('ARQ_MIGRATION_FAILED', 'The project did not report a migration result.');
      }
      openResult = migrationPayload.result;
      openSafeMode = migrationPayload.safeMode;
      if (openResult.status === 'rejected') {
        return rejected('ARQ_MIGRATION_FAILED', openResult.reason);
      }
      conditionWarning = describeOpenCondition(openSafeMode);
      if (!openSafeMode.canOpen && conditionWarning !== null) {
        return rejected('ARQ_MIGRATION_FAILED', conditionWarning);
      }
      migrated = true;
    }
    progress?.onMigrationVerified?.(migrated);

    const capabilities = resolveNativeOpenCapabilities(openResult);
    const readOnly = capabilities.readOnly || writerLocked || conditionWarning !== null;
    const warnings = [
      ...capabilities.warnings,
      ...(conditionWarning === null ? [] : [conditionWarning]),
      ...(writerLocked ? [describeReadOnlyReason(lease.reason)] : []),
    ];
    if (!openResult.capabilities.canRead) {
      return rejected('ARQ_OPEN_NOT_READABLE', capabilities.warnings[0] ?? 'Not readable.');
    }

    // Reports the whole truth about writability, which now has two independent
    // causes: the file's own writer-version floor, and whether this context won
    // the writer lock. Reporting only the first would announce a writable
    // project and then hand back a read-only one.
    progress?.onWorkerOpened(!readOnly, writerLocked ? 'another-window-is-editing' : null);
`,
          );

          const policy = 'apps/web/src/project/native-open-policy.ts';
          replaceOne(
            policy,
            "  olderSchema:\n    'This project uses an older Arq format. It is open for reading only, because upgrading it needs a migration that keeps a recoverable copy of the original, and that is not available in this build yet.',\n",
            "  olderSchema:\n    'This project uses an older Arq format. It is open for reading only in this window because its local working copy could not be upgraded safely here.',\n",
          );
          replaceOne(
            policy,
            "  // `canMigrate` means the file is on an older schema this build *could* bring\n  // forward. It is deliberately treated as read-only rather than as permission\n  // to write. Copy-on-write migration exists as a library, but it is not\n  // reachable from the product and its recovery evidence has not been run\n  // end to end - so authoring against an old-schema file would write current\n  // semantics into a file still declaring the old schema. ADR-0028 records this\n  // as a decision, not an oversight; it lifts when migration is user-reachable\n  // and verified.\n",
            "  // `canMigrate` now remains true only when the product deliberately did not\n  // migrate this working copy, most commonly because another window owns the\n  // writer lease. A successfully migrated candidate is reopened before it reaches\n  // this policy and therefore arrives with `canMigrate: false`.\n",
          );

          const machine = 'apps/web/src/file-handling/file-state-machine.ts';
          replaceOne(
            machine,
            "  | { readonly kind: 'migrating'; readonly name: string; readonly fraction: number }\n",
            "  | { readonly kind: 'migrating'; readonly name: string; readonly projectId: string; readonly fraction: number }\n",
          );
          replaceOne(
            machine,
            "  | { readonly kind: 'migration-verified'; readonly name: string; readonly projectId: string }\n",
            "  | { readonly kind: 'migration-verified'; readonly name: string; readonly projectId: string; readonly migrated: boolean }\n",
          );
          replaceOne(
            machine,
            "  | { readonly type: 'stage-complete'; readonly projectId: string }\n  | { readonly type: 'migration-verified' }\n",
            "  | { readonly type: 'stage-complete'; readonly projectId: string }\n  | { readonly type: 'migration-start' }\n  | { readonly type: 'migration-verified'; readonly migrated: boolean }\n",
          );
          replaceOne(
            machine,
            `  if (state.kind === 'staged' && event.type === 'migration-verified') {
    return { kind: 'migration-verified', name: state.name, projectId: state.projectId };
  }
`,
            `  if (state.kind === 'staged' && event.type === 'migration-start') {
    return { kind: 'migrating', name: state.name, projectId: state.projectId, fraction: 0 };
  }
  if (state.kind === 'staged' && event.type === 'migration-verified') {
    return {
      kind: 'migration-verified',
      name: state.name,
      projectId: state.projectId,
      migrated: event.migrated,
    };
  }
  if (state.kind === 'migrating' && event.type === 'migration-verified') {
    return {
      kind: 'migration-verified',
      name: state.name,
      projectId: state.projectId,
      migrated: event.migrated,
    };
  }
`,
          );

          const describeState = 'apps/web/src/file-handling/describe-file-flow-state.ts';
          replaceOne(
            describeState,
            `    case 'migration-verified':
      return {
        headline: \`\${state.name} was upgraded and checked.\`,
        detail: 'The upgrade ran on the copy. Your original file is not changed.',
        tone: 'progress',
      };
`,
            `    case 'migration-verified':
      return state.migrated
        ? {
            headline: \`\${state.name} was upgraded and checked.\`,
            detail: 'The upgrade ran on the local working copy. Your original file is not changed.',
            tone: 'progress',
          }
        : {
            headline: \`\${state.name} is copied and checked.\`,
            detail: 'No format upgrade was needed. Your original file is not changed.',
            tone: 'progress',
          };
`,
          );

          const panel = 'apps/web/src/file-handling/FileOpenPanel.tsx';
          replaceOne(
            panel,
            `        onStaged: (projectId) => {
          emit({ type: 'stage-complete', projectId });
          emit({ type: 'migration-verified' });
        },
`,
            `        onStaged: (projectId) => {
          emit({ type: 'stage-complete', projectId });
        },
        onMigrationStart: () => emit({ type: 'migration-start' }),
        onMigrationVerified: (migrated) => emit({ type: 'migration-verified', migrated }),
`,
          );
          replaceOne(
            panel,
            `    if (opened.status === 'rejected') {
      const { code, reason } = opened;
      emit({ type: 'fail', code, message: reason });
      return;
    }
`,
            `    if (opened.status === 'rejected') {
      const { code, reason } = opened;
      if (code === 'ARQ_MIGRATION_FAILED') {
        emit({ type: 'project-fail', reason: 'migration-failed', detail: reason });
      } else {
        emit({ type: 'fail', code, message: reason });
      }
      return;
    }
`,
          );
          replaceOne(
            panel,
            "  const busy = state.kind === 'acquiring' || state.kind === 'detecting';\n",
            "  const busy =\n    state.kind === 'acquiring' ||\n    state.kind === 'detecting' ||\n    state.kind === 'staging' ||\n    state.kind === 'migrating' ||\n    state.kind === 'worker-open' ||\n    state.kind === 'hydrating';\n",
          );

          const protocolTest = 'packages/arqfs/src/arqfs-worker-protocol.test.ts';
          replaceOne(
            protocolTest,
            "    ['open', { id: 1, type: 'open' }],\n",
            "    ['open', { id: 1, type: 'open' }],\n    ['migrateSchemaV1ToV2', { id: 9, type: 'migrateSchemaV1ToV2' }],\n",
          );

          const handlerTest = 'packages/arqfs/src/arqfs-worker-handler.test.ts';
          replaceOne(
            handlerTest,
            "  it(\"'open' is idempotent - opening an already-initialised database again does not fail or re-create the schema\", async () => {\n",
            `  it('migrates an eligible schema-v1 working copy to v2 and verifies the reopened result', async () => {
    const ctx = freshContext();
    createArqfsSchemaV1(ctx.driver);

    const opened = await handleArqfsWorkerRequest(ctx, { id: 1, type: 'open' });
    expect(opened.ok).toBe(true);
    if (!opened.ok || opened.payload.kind !== 'open' || opened.payload.result.status !== 'opened') {
      throw new Error('expected an older schema to open');
