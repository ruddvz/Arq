name: Public site v2 one-shot repair

on:
  push:
    branches:
      - codex/arq-public-site-editorial-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/arq-public-site-editorial-v1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Make the marketing reduced-motion probe hero-implementation agnostic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-marketing-viewport-capability-check.mjs')
          text = path.read_text()
          old = "document.querySelector('.hero h1')"
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'Expected exactly 3 legacy hero selectors, found {count}')
          path.write_text(text.replace(old, "document.querySelector('main h1')"))
          PY

      - name: Format changed public-site files and inherited unformatted plan docs
        run: |
          pnpm exec prettier --write \
            apps/marketing/src/build.ts \
            apps/marketing/src/layout.ts \
            apps/marketing/src/content/home.ts \
            apps/marketing/src/editorial-components.ts \
            apps/marketing/src/editorial.css \
            scripts/run-marketing-viewport-capability-check.mjs \
            docs/product/ARQ-UI-UX-ISSUE-EXECUTION-INDEX.md \
            docs/product/ARQ-UI-UX-MASTER-EXECUTION-PLAN-v1.0.md

      - name: Regenerate Engineering OS source-bound context
        run: node engineering/tools/engineering/build-engineering-context.mjs --root engineering --repo-root .

      - name: Remove the one-shot workflow and commit the generated repair
        run: |
          git rm .github/workflows/public-site-v2-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/marketing/src/build.ts \
            apps/marketing/src/layout.ts \
            apps/marketing/src/content/home.ts \
            apps/marketing/src/editorial-components.ts \
            apps/marketing/src/editorial.css \
            scripts/run-marketing-viewport-capability-check.mjs \
            docs/product/ARQ-UI-UX-ISSUE-EXECUTION-INDEX.md \
            docs/product/ARQ-UI-UX-MASTER-EXECUTION-PLAN-v1.0.md \
            engineering/ops/generated/engineering-context-v5.json
          git diff --cached --check
          git commit -m 'chore(marketing): refresh formatting and engineering context'
          git push origin HEAD:codex/arq-public-site-editorial-v1
