name: Format ZEUS doctor fix

on:
  push:
    branches:
      - codex/zeus-doctor-status-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zeus-doctor-status-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatting to doctor files
        run: pnpm exec prettier --write scripts/zeus-doctor.mjs scripts/zeus-doctor.test.mjs
      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/zeus-doctor.mjs scripts/zeus-doctor.test.mjs; then
            echo "Doctor files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/zeus-doctor.mjs scripts/zeus-doctor.test.mjs
          git commit -m "style(zeus): format doctor status files"
          git push origin HEAD:codex/zeus-doctor-status-v1
