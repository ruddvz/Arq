name: "Temporary #361 exact host safety repair"

on:
  push:
    branches:
      - codex/arq-native-editor-persistence-355-recovery

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arq-native-editor-persistence-355-recovery
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply assertion-guarded source patch
        run: echo '' | base64 --decode > /tmp/patch-361.py && python3 /tmp/patch-361.py
      - name: Format touched source files
        run: pnpm exec prettier --write apps/web/src/App.tsx apps/web/src/file-handling/FileOpenPanel.tsx apps/web/src/NativeProjectPanel.tsx apps/web/src/project/native-project-replacement.test.ts
      - name: Refresh governed generated contexts
        run: |
          pnpm arq:language:refresh
          pnpm engineering:context:build
      - name: Verify focused repair
        run: |
          git diff --check
          pnpm vitest run apps/web/src/project/native-project-replacement.test.ts apps/web/src/project/native-project-session.test.ts apps/web/src/project/workspace-persistence.test.ts
          pnpm --filter @arq/web typecheck
          pnpm arq:language:context:verify
          pnpm engineering:context:verify
      - name: Commit exact repair and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temporary-361-host-safety-patch.yml
          git add apps/web/src/App.tsx apps/web/src/file-handling/FileOpenPanel.tsx apps/web/src/NativeProjectPanel.tsx apps/web/src/project/native-project-replacement.test.ts docs/product/voice/generated-repo-context.json docs/product/voice/context/REFRESH-LOG.json engineering/ops/generated/engineering-context-v5.json
          git commit -m 'fix(ARQFS): gate destructive project transitions safely'
          git push origin HEAD:codex/arq-native-editor-persistence-355-recovery
