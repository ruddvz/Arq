name: Selection authority evidence

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-selection-authority-capability-check.mjs'
      - 'docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md'
      - '.github/workflows/selection-authority-evidence.yml'
  workflow_dispatch:

concurrency:
  group: selection-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-selection-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align native level evidence with the real Views browser section
        run: |
          python - <<'PY'
          from pathlib import Path

          probe = Path('scripts/run-selection-authority-capability-check.mjs')
          text = probe.read_text()
          old = "  const levels = page.getByRole('region', { name: 'Floor plans' });"
          replacement = "\n".join([
              "  const browserViewsTab = page.getByRole('tab', { name: 'Views', exact: true }).first();",
              "  await browserViewsTab.click();",
              "  const levels = page.getByRole('region', { name: 'Floor plans' });",
              "  await levels.waitFor({ state: 'visible', timeout: 5000 });",
          ])
          if old not in text:
              raise SystemExit('expected Floor plans locator was not found')
          probe.write_text(text.replace(old, replacement, 1))

          audit = Path('docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md')
          doc = audit.read_text()
          stale = (
              "Required issue #319 could not be resolved from the live repository. This audit\n"
              "does not invent a contract for it."
          )
          current = (
              "Issue #319 is live and governs deterministic multi-agent work ownership only. Its\n"
              "own boundary says repository claims must not change ARQ design/evidence truth, so\n"
              "it does not create another selection authority for #401."
          )
          if stale not in doc:
              raise SystemExit('expected stale #319 audit note was not found')
          doc = doc.replace(stale, current, 1)
          old_list = (
              "1. Plan wall selection -> tree, inspector and 3D projection.\n"
              "2. Tree wall selection -> Plan, inspector and 3D projection.\n"
              "3. Plan -> 3D -> Plan semantic selection continuity.\n"
              "4. Delete one selected target -> no stale semantic selection and one fewer\n"
              "   drawn-wall row.\n"
              "5. Active-level switch -> deterministic selection clear.\n"
              "6. DOM focus movement -> semantic selection unchanged.\n"
              "7. Escape -> semantic selection preserved; empty 3D click -> deterministic\n"
              "   semantic clear."
          )
          new_list = (
              "1. Plan wall selection -> tree, inspector and 3D projection.\n"
              "2. Tree wall selection -> Plan, inspector and 3D projection.\n"
              "3. Plan -> 3D -> Plan semantic selection continuity.\n"
              "4. Delete one selected target -> no stale semantic selection and one fewer\n"
              "   drawn-wall row.\n"
              "6. Active-level switch -> deterministic selection clear.\n"
              "7. DOM focus movement -> semantic selection unchanged.\n"
              "8. Escape -> semantic selection preserved; empty 3D click -> deterministic\n"
              "   semantic clear."
          )
          if old_list not in doc:
              raise SystemExit('expected browser scenario list was not found')
          audit.write_text(doc.replace(old_list, new_list, 1))
          PY
          pnpm exec prettier --write scripts/run-selection-authority-capability-check.mjs docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md
      - name: Persist evidence-only corrections on the PR branch
        run: |
          if ! git diff --quiet -- scripts/run-selection-authority-capability-check.mjs docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md; then
            git stash push -- scripts/run-selection-authority-capability-check.mjs docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md
            git fetch origin "${{ github.head_ref }}"
            git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
            git stash pop
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add scripts/run-selection-authority-capability-check.mjs docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md
            git commit -m "test(ux): align #401 level evidence with project Views"
            git push origin "${{ github.head_ref }}"
          fi
