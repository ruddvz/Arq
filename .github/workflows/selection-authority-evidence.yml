name: Selection authority evidence

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-selection-authority-capability-check.mjs'
      - '.github/workflows/selection-authority-evidence.yml'
  workflow_dispatch:

concurrency:
  group: selection-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-selection-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace hard-coded native level label with discovered inactive level
        run: |
          python - <<'PY'
          from pathlib import Path

          probe = Path('scripts/run-selection-authority-capability-check.mjs')
          text = probe.read_text()
          old = "  await levels.getByRole('button', { name: /Upper floor/ }).click();"
          replacement = "\n".join([
              "  const levelButtons = levels.getByRole('button');",
              "  const levelCount = await levelButtons.count();",
              "  if (levelCount < 2) {",
              "    throw new Error(`native fixture exposed ${levelCount} floor-plan buttons; expected at least 2`);",
              "  }",
              "  const levelCandidates = [];",
              "  for (let index = 0; index < levelCount; index += 1) {",
              "    const button = levelButtons.nth(index);",
              "    const label =",
              "      (await button.getAttribute('aria-label'))?.trim() ||",
              "      (await button.innerText()).trim() ||",
              "      `level-${index + 1}`;",
              "    const isCurrent =",
              "      (await button.getAttribute('aria-current')) === 'true' ||",
              "      (await button.getAttribute('aria-current')) === 'page' ||",
              "      (await button.getAttribute('aria-selected')) === 'true' ||",
              "      (await button.getAttribute('aria-pressed')) === 'true';",
              "    if (!(await button.isDisabled()) && !isCurrent && !/add|create|new/i.test(label)) {",
              "      levelCandidates.push({ index, label });",
              "    }",
              "  }",
              "  const target = levelCandidates.at(-1) ?? { index: levelCount - 1, label: `level-${levelCount}` };",
              "  observed.nativeLevelButtons = levelCandidates.map(({ label }) => label);",
              "  observed.levelSwitchTarget = target.label;",
              "  await levelButtons.nth(target.index).click();",
          ])
          if old not in text:
              raise SystemExit('expected hard-coded Upper floor locator was not found')
          probe.write_text(text.replace(old, replacement))
          PY
          pnpm exec prettier --write scripts/run-selection-authority-capability-check.mjs
      - name: Persist hardened native level probe
        run: |
          if ! git diff --quiet -- scripts/run-selection-authority-capability-check.mjs; then
            git stash push -- scripts/run-selection-authority-capability-check.mjs
            git fetch origin "${{ github.head_ref }}"
            git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
            git stash pop
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add scripts/run-selection-authority-capability-check.mjs
            git commit -m "test(ux): discover native level in #401 browser evidence"
            git push origin "${{ github.head_ref }}"
          fi
