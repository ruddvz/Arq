name: Selection authority evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/design-system/**'
      - 'packages/workspace/**'
      - 'packages/model-renderer/**'
      - 'packages/plan-renderer/**'
      - 'scripts/run-selection-authority-capability-check.mjs'
      - '.github/workflows/selection-authority-evidence.yml'
      - 'docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/design-system/**'
      - 'packages/workspace/**'
      - 'packages/model-renderer/**'
      - 'packages/plan-renderer/**'
      - 'scripts/run-selection-authority-capability-check.mjs'
      - '.github/workflows/selection-authority-evidence.yml'
      - 'docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md'
  workflow_dispatch:

concurrency:
  group: selection-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-selection-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare deterministic 3D clear-selection probe
        run: |
          python - <<'PY'
          from pathlib import Path

          probe = Path('scripts/run-selection-authority-capability-check.mjs')
          text = probe.read_text()
          text = text.replace(
              ' *  8. Escape preserves semantic selection; empty-canvas selection is the current\n *     deterministic clear path.\n',
              ' *  8. Escape preserves semantic selection; an empty 3D click is the current\n *     deterministic clear path.\n',
          )
          old = """  await activateSelectTool(page);\n  const clearBox = await plan.boundingBox();\n  if (clearBox === null) throw new Error('plan canvas lost its bounding box');\n  await page.mouse.click(clearBox.x + clearBox.width * 0.86, clearBox.y + clearBox.height * 0.82);\n  await page.waitForFunction(\n    () => document.querySelectorAll('[role=\"treeitem\"][aria-selected=\"true\"]').length === 0,\n    undefined,\n    { timeout: 5000 },\n  );\n  await assertNoSelection(page, 'empty-plan-click clear');\n  observed.escapePreservesSelection = true;\n  observed.emptyClickClearsSelection = true;\n\n  /* 2. Tree selection -> Plan/inspector/3D, without another selection source. */\n"""
          new = """  await tab3d.click();\n  await model.waitFor({ state: 'visible', timeout: 5000 });\n  const emptyPoint = await page.evaluate(() => {\n    const canvas = document.querySelector('canvas[aria-label=\"3D model view\"]');\n    const panel = document.querySelector('.arq-workspace__overlay--left');\n    const canvasBox = canvas.getBoundingClientRect();\n    const panelBox = panel?.getBoundingClientRect() ?? null;\n    const clearOfPanel =\n      panelBox === null ? 8 : Math.max(8, panelBox.right - canvasBox.left + 24);\n    return { x: clearOfPanel, y: 24 };\n  });\n  await model.click({ position: emptyPoint });\n  await page.waitForFunction(\n    () => document.querySelectorAll('[role=\"treeitem\"][aria-selected=\"true\"]').length === 0,\n    undefined,\n    { timeout: 5000 },\n  );\n  await assertNoSelection(page, 'empty-3d-click clear');\n  observed.empty3dClear = await waitForGreenSelection(page, model, false);\n  observed.escapePreservesSelection = true;\n  observed.empty3dClickClearsSelection = true;\n  await planTab.click();\n  await plan.waitFor({ state: 'visible', timeout: 5000 });\n\n  /* 2. Tree selection -> Plan/inspector/3D, without another selection source. */\n"""
          if old not in text:
              raise SystemExit('expected Plan clear-selection block was not found')
          probe.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write scripts/run-selection-authority-capability-check.mjs
      - name: Upload corrected #401 probe source
        uses: actions/upload-artifact@v4
        with:
          name: selection-authority-corrected-source
          path: scripts/run-selection-authority-capability-check.mjs
      - name: Verify #401 evidence files are formatted
        run: >-
          pnpm exec prettier --check
          scripts/run-selection-authority-capability-check.mjs
          docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md
          .github/workflows/selection-authority-evidence.yml
      - name: Compile Zeus task context for #401
        run: >-
          node scripts/zeus.mjs compile --task
          "Finish ARQ issue #401 by validating selection, focus and interaction-state authority across Plan, 3D, tree and inspector at current exact head. Add deterministic evidence only. Do not redesign selection."
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-selection-authority-capability-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selection-authority-evidence
          path: benchmarks/results/selection-authority.*
