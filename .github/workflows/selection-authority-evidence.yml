name: Selection authority evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/design-system/**'
      - 'packages/workspace/**'
      - 'packages/model-renderer/**'
      - 'packages/plan-renderer/**'
      - 'scripts/run-selection-authority-capability-check.mjs'
      - '.github/workflows/selection-authority-evidence.yml'
      - 'docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md'
  workflow_dispatch:

concurrency:
  group: selection-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-selection-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare formatted probe candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          probe = Path('scripts/run-selection-authority-capability-check.mjs')
          text = probe.read_text()
          old = """  await drawWall(page, wallA.start, wallA.end);\n  await drawWall(page, wallB.start, wallB.end);\n"""
          new = """  await drawWall(page, wallA.start, wallA.end);\n  await page.mouse.click(wallB.start.x, wallB.start.y);\n  await page.mouse.click(wallB.end.x, wallB.end.y);\n  await page.keyboard.press('Enter');\n"""
          if old not in text:
              raise SystemExit('expected second-wall probe source was not found')
          probe.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write \
            scripts/run-selection-authority-capability-check.mjs \
            docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md \
            .github/workflows/selection-authority-evidence.yml
      - uses: actions/upload-artifact@v4
        with:
          name: selection-authority-formatted-source
          path: |
            scripts/run-selection-authority-capability-check.mjs
            docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md
            .github/workflows/selection-authority-evidence.yml
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-selection-authority-capability-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selection-authority-evidence
          path: benchmarks/results/selection-authority.*
