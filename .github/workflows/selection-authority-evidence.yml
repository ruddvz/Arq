name: Diagnose #401 tree semantic replacement

on:
  push:
    branches:
      - codex/arq-401-selection-authority-evidence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arq-401-selection-authority-evidence
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harden distinct tree target evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-selection-authority-capability-check.mjs')
          text = path.read_text()
          old = '''  const drawnRows = page.getByRole('treeitem').filter({ hasText: '(drawn)' });
          check((await drawnRows.count()) >= 2, 'scratch setup did not expose two drawn walls in the tree');
          '''
          new = '''  const modelPanel = page.locator('nav[aria-label="Model"]:visible').first();
          const drawnRows = modelPanel.getByRole('treeitem').filter({ hasText: '(drawn)' });
          check((await drawnRows.count()) >= 2, 'scratch setup did not expose two drawn walls in the visible tree');
          '''
          if old not in text:
              raise SystemExit('drawnRows source block not found')
          text = text.replace(old, new, 1)

          old = '''  await drawnRows.nth(0).locator('button').click();
          const treeFirstId = await inspectorId(page);
          const firstPlanPixels = await analyzeScreenshot(page, await plan.screenshot());
          const otherDrawnRow = page
            .locator('[role="treeitem"][aria-selected="false"]')
            .filter({ hasText: '(drawn)' })
            .first();
          await otherDrawnRow.locator('button').click();
          await page.waitForFunction(
            (previousId) => {
              const input = document.querySelector('aside[aria-label="Inspector"] input[aria-label="ID"]');
              return input instanceof HTMLInputElement && input.value !== previousId;
            },
            treeFirstId,
            { timeout: 5000 },
          );
          const treeSecondId = await inspectorId(page);
          const secondPlanPixels = await analyzeScreenshot(page, await plan.screenshot());
          '''
          new = '''  const firstTreeRow = drawnRows.nth(0);
          const firstTreePosition = await firstTreeRow.getAttribute('aria-posinset');
          check(firstTreePosition !== null, 'first drawn tree row has no stable aria-posinset');
          await firstTreeRow.locator('button').click();
          await modelPanel
            .locator(
              `[role="treeitem"][aria-posinset="${firstTreePosition}"][aria-selected="true"]`,
            )
            .waitFor({ state: 'attached', timeout: 5000 });
          await page
            .locator('aside[aria-label="Inspector"] input[aria-label="ID"]')
            .first()
            .waitFor({ state: 'visible', timeout: 5000 });
          const treeFirstId = await inspectorId(page);
          const firstPlanPixels = await analyzeScreenshot(page, await plan.screenshot());

          const otherDrawnRow = modelPanel
            .locator('[role="treeitem"][aria-selected="false"]')
            .filter({ hasText: '(drawn)' })
            .first();
          const secondTreePosition = await otherDrawnRow.getAttribute('aria-posinset');
          check(secondTreePosition !== null, 'second drawn tree row has no stable aria-posinset');
          check(
            secondTreePosition !== firstTreePosition,
            'tree evidence did not resolve a distinct drawn-wall row',
          );
          await otherDrawnRow.locator('button').click();
          await modelPanel
            .locator(
              `[role="treeitem"][aria-posinset="${secondTreePosition}"][aria-selected="true"]`,
            )
            .waitFor({ state: 'attached', timeout: 5000 });
          await page
            .locator('aside[aria-label="Inspector"] input[aria-label="ID"]')
            .first()
            .waitFor({ state: 'visible', timeout: 5000 });
          await page.waitForFunction(
            (previousId) => {
              const input = document.querySelector('aside[aria-label="Inspector"] input[aria-label="ID"]');
              return input instanceof HTMLInputElement && input.value !== previousId;
            },
            treeFirstId,
            { timeout: 5000 },
          );
          const treeSecondId = await inspectorId(page);
          const secondPlanPixels = await analyzeScreenshot(page, await plan.screenshot());
          observed.treePositions = [firstTreePosition, secondTreePosition];
          '''
          if old not in text:
              raise SystemExit('tree replacement source block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write scripts/run-selection-authority-capability-check.mjs
      - name: Persist harness repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-selection-authority-capability-check.mjs
          git commit -m 'test(UX): resolve distinct #401 tree targets semantically'
          git push origin HEAD:codex/arq-401-selection-authority-evidence
