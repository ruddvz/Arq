name: Repair #401 active-tree evidence

on:
  push:
    branches:
      - codex/arq-401-selection-authority-evidence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arq-401-selection-authority-evidence
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scope tree evidence to visible Model browser
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/run-selection-authority-capability-check.mjs')
          text = path.read_text()
          pattern = re.compile(
              r"  const drawnRows = page\.getByRole\('treeitem'\)\.filter\(\{ hasText: '\(drawn\)' \}\);\n  check\(\(await drawnRows\.count\(\)\) >= 2, 'scratch setup did not expose two drawn walls in the tree'\);"
          )
          replacement = '''  const modelPanel = page.locator('nav[aria-label="Model"]:visible').first();
          check((await modelPanel.count()) === 1, 'scratch setup did not expose one visible Model browser');
          const drawnRows = modelPanel.getByRole('treeitem').filter({ hasText: '(drawn)' });
          check(
            (await drawnRows.count()) >= 2,
            'scratch setup did not expose two drawn walls in the visible Model browser',
          );'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'visible Model browser replacement count={count}')
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write scripts/run-selection-authority-capability-check.mjs
      - name: Persist evidence repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-selection-authority-capability-check.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(UX): scope #401 tree evidence to active browser'
          git push origin HEAD:codex/arq-401-selection-authority-evidence
