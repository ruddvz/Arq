name: Selection authority evidence

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/design-system/**'
      - 'packages/workspace/**'
      - 'packages/model-renderer/**'
      - 'packages/plan-renderer/**'
      - 'scripts/run-selection-authority-capability-check.mjs'
      - 'scripts/selection-authority-state-flow.test.mjs'
      - '.github/workflows/selection-authority-evidence.yml'
      - 'docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/design-system/**'
      - 'packages/workspace/**'
      - 'packages/model-renderer/**'
      - 'packages/plan-renderer/**'
      - 'scripts/run-selection-authority-capability-check.mjs'
      - 'scripts/selection-authority-state-flow.test.mjs'
      - '.github/workflows/selection-authority-evidence.yml'
      - 'docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md'
  workflow_dispatch:

concurrency:
  group: selection-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-selection-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final #401 authority map
        run: pnpm exec prettier --write docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md
      - name: Persist formatted authority map on the PR branch
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md; then
            git stash push -- docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md
            git fetch origin "${{ github.head_ref }}"
            git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
            git stash pop
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add docs/product/ARQ-UI-UX-SELECTION-FOCUS-AUTHORITY-MAP.md
            git commit -m "docs(ux): format #401 authority map"
            git push origin "${{ github.head_ref }}"
          fi
