name: ARQ 355 engineering context refresh

on:
  push:
    branches:
      - codex/arq-native-editor-persistence-355-recovery
    paths:
      - .github/workflows/arq-355-engineering-context-refresh.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arq-native-editor-persistence-355-recovery
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh generated engineering context
        run: pnpm engineering:context:build
      - name: Verify refreshed engineering context
        run: pnpm engineering:context:verify
      - name: Commit generated engineering context only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add engineering/ops/generated/engineering-context-v5.json
          git diff --cached --exit-code && { echo "No generated engineering context change found"; exit 1; } || true
          git commit -m "chore(engineering): refresh context for native persistence"
          git push origin HEAD:codex/arq-native-editor-persistence-355-recovery
