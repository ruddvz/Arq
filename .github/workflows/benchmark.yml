# #402 performance authority. Structural/schema checks gate relevant changes.
# Browser timing evidence also runs on performance-infrastructure PRs so an
# authority change carries exact-head measurements, but shared-runner timings
# are reference evidence only and are not used as universal millisecond gates.
name: Benchmark

on:
  workflow_dispatch:
  schedule: [{ cron: '0 5 * * 1' }]
  pull_request:
    paths:
      - 'benchmarks/PERFORMANCE-BUDGETS.json'
      - 'benchmarks/fixtures/**'
      - 'packages/plan-renderer/benchmarks/canvas-2d/scene.js'
      - 'scripts/core-workflow-product-fixture.test.ts'
      - 'scripts/check-performance-authority*.mjs'
      - 'scripts/lib/performance-authority.mjs'
      - 'scripts/run-core-workflow-performance.mjs'
      - 'scripts/run-core-3d-first-open-performance.mjs'
      - 'scripts/run-material-compositing-performance.mjs'
      - 'scripts/run-render-frame-benchmark.mjs'
      - 'scripts/run-canvas-2d-benchmark.mjs'
      - 'scripts/run-pixijs-webgl-benchmark.mjs'
      - 'scripts/run-canvaskit-benchmark.mjs'
      - '.github/workflows/benchmark.yml'

jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove product-executable Core fixture candidate
        run: pnpm vitest run scripts/core-workflow-product-fixture.test.ts
      - run: node scripts/check-performance-authority-test.mjs
      - run: node scripts/check-performance-authority.mjs
      - run: pnpm check:web-bundle-budget:test

  reference-workflows:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm --filter @arq/web build
      - run: node scripts/check-performance-authority.mjs
      - run: pnpm check:web-bundle-budget
      - run: pnpm benchmark:render-frame
        continue-on-error: true
      - run: pnpm benchmark:canvas2d
        continue-on-error: true
      - run: node scripts/run-core-workflow-performance.mjs
        continue-on-error: true
      - run: node scripts/run-core-3d-first-open-performance.mjs
        continue-on-error: true
      - run: node scripts/run-material-compositing-performance.mjs
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-performance-reference-results
          path: benchmarks/results/
