name: ARQ 355 language context refresh

on:
  push:
    branches:
      - codex/arq-native-editor-persistence-355-recovery
    paths:
      - .github/workflows/arq-355-language-refresh.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arq-native-editor-persistence-355-recovery
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh generated ARQ language context
        run: pnpm arq:language:refresh
      - name: Verify refreshed context
        run: pnpm arq:language:context:verify
      - name: Verify complete language system
        run: pnpm arq:language:verify
      - name: Commit generated context only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add docs/product/voice
          git diff --cached --exit-code && { echo "No generated context change found"; exit 1; } || true
          git commit -m "chore(language): refresh context for native persistence"
          git push origin HEAD:codex/arq-native-editor-persistence-355-recovery
