name: ARQ 355 recovery validation v3

on:
  push:
    branches:
      - codex/arq-native-editor-persistence-355-recovery
    paths:
      - .github/workflows/arq-355-recovery-v3.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arq-native-editor-persistence-355-recovery
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harden App patch against current formatting
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/arq-355-recovery.py')
          text = path.read_text()
          start = text.index('operation_pattern = re.compile(')
          end = text.index('\nopen_state =', start)
          replacement = r'''app = replace_once(
              app,
              "  /** Applies a typed operation to the plan document, records its real inverse, journals it. */",
              "  /** Applies a typed operation to the plan document, records its real inverse, and persists it. */",
              "operation comment",
          )
          app = replace_once(
              app,
              """      setDrawnWalls(applyOperation(current, operation));
                setHistoryVersion((v) => v + 1);
                journalOperation(operation);""",
              """      const next = applyOperation(current, operation);
                setDrawnWalls(next);
                setHistoryVersion((v) => v + 1);
                persistOperation(operation, next);""",
              "forward operation persistence",
          )
          app = replace_once(
              app,
              """      setDrawnWalls(applyOperation(drawnWallsRef.current, inverse));
                journalOperation(inverse);""",
              """      const next = applyOperation(drawnWallsRef.current, inverse);
                setDrawnWalls(next);
                persistOperation(inverse, next);""",
              "undo persistence",
          )
          app = replace_once(
              app,
              """      setDrawnWalls(applyOperation(drawnWallsRef.current, forward));
                journalOperation(forward);""",
              """      const next = applyOperation(drawnWallsRef.current, forward);
                setDrawnWalls(next);
                persistOperation(forward, next);""",
              "redo persistence",
          )
          remaining = app.count('journalOperation')
          if remaining != 3:
              raise SystemExit(f'journal dependency references: expected 3, found {remaining}')
          app = app.replace('journalOperation', 'persistOperation')
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Integrate native persistence into current main code
        run: python3 scripts/arq-355-recovery.py
      - name: Format scoped changes
        run: pnpm exec prettier --write apps/web/src/App.tsx apps/web/src/project/native-project-session.ts apps/web/src/project/native-project-session.test.ts apps/web/src/project/workspace-persistence.ts apps/web/src/project/workspace-persistence.test.ts
      - name: Run focused persistence tests
        run: pnpm exec vitest run apps/web/src/project/native-project-session.test.ts apps/web/src/project/workspace-persistence.test.ts --coverage=false
      - name: Typecheck web app
        run: pnpm --filter @arq/web typecheck
      - name: Run repository typecheck
        run: pnpm typecheck
      - name: Commit recovered implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/project/native-project-session.ts apps/web/src/project/native-project-session.test.ts apps/web/src/project/workspace-persistence.ts apps/web/src/project/workspace-persistence.test.ts
          git commit -m "feat(arqfs): persist workspace edits through native sessions"
          git push origin HEAD:codex/arq-native-editor-persistence-355-recovery
