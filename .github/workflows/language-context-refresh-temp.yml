name: Language context refresh (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/language-context-refresh-temp.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate-and-clean-up:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/zeus-main-migration-prep-332'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh governed language context
        run: pnpm arq:language:refresh
      - name: Verify refreshed context
        run: pnpm arq:language:context:verify
      - name: Remove temporary refresh workflow
        run: rm .github/workflows/language-context-refresh-temp.yml
      - name: Commit refreshed language context and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product/voice/generated-repo-context.json docs/product/voice/context/REFRESH-LOG.json .github/workflows/language-context-refresh-temp.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore(language): refresh context for main migration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
