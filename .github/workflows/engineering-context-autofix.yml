name: Engineering context autofix

on:
  push:
    branches:
      - codex/zeus-autonomy-gate-integration-v4

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zeus-autonomy-gate-integration-v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate repository-bound Engineering OS context
        run: node engineering/tools/engineering/build-engineering-context.mjs --root engineering --repo-root .
      - name: Commit generated context and remove this one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/engineering-context-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engineering/ops/generated/engineering-context-v5.json .github/workflows/engineering-context-autofix.yml
          git commit -m "chore(engineering): refresh repository-bound context"
          git push origin HEAD:codex/zeus-autonomy-gate-integration-v4
