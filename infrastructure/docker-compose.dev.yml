services:
  postgres:
    image: postgres:REPLACE_WITH_APPROVED_PIN
    environment: { POSTGRES_DB: arq, POSTGRES_USER: arq, POSTGRES_PASSWORD: arq }
    ports: ['5432:5432']
    volumes: ['arq-postgres:/var/lib/postgresql/data']
  minio:
    image: minio/minio:REPLACE_WITH_APPROVED_PIN
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: arq, MINIO_ROOT_PASSWORD: replace-me }
    ports: ['9000:9000', '9001:9001']
    volumes: ['arq-minio:/data']
volumes: { arq-postgres: {}, arq-minio: {} }
